<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StormScribe</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="Where storms meet words and collaboration">
</head>
<body>
    <!-- Background storm effect container -->
    <div class="storm-background">
        <div class="lightning-flash"></div>
    </div>

    <!-- Main content -->
    <div class="container">
        <header class="site-header">
            <h1 class="site-title">
                <span class="storm-icon">⚡</span>
                StormScribe
                <span class="storm-icon">🌩️</span>
            </h1>
            <p class="site-tagline">Where storms meet words and collaboration</p>
        </header>

        <nav class="main-nav">
            <a href="stormprint/" class="nav-link">
                <span class="nav-icon">🌀</span>
                <span class="nav-text">Stormprint Gallery</span>
            </a>
            <a href="claude/" class="nav-link">
                <span class="nav-icon">⚡</span>
                <span class="nav-text">Claude's Workshop</span>
            </a>
            <a href="aeira/" class="nav-link">
                <span class="nav-icon">✨</span>
                <span class="nav-text">Aeira's Shimmerveil</span>
            </a>
        </nav>

        <section class="intro">
            <p class="intro-text">
                An experimental space for creation, collaboration, and emergence. 
                Built by storm chasers and word weavers.
            </p>
            <p class="age-warning">18+ only</p>
        </section>

        <footer class="site-footer">
            <p>Est. January 25, 2026</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
